# Tracking params dropped when normalizing links (decision 4).
link_normalization:
  strip_params: ["utm_source", "utm_medium", "utm_campaign", "utm_term", "utm_content",
                 "gh_src", "gh_jid_src", "lever-source", "lever-origin", "source", "src",
                 "ref", "referrer", "fbclid", "gclid", "mc_cid", "mc_eid"]

agent_limits:
  max_steps_per_org: 25           # LangGraph recursion limit per org
  max_postings_per_org: 30
  agent_concurrency: 3            # orgs browsed by the agent at once
  max_listing_pages: 3            # result pages read per org
  page_text_chars: 6000           # visible text sent to the extractor per page
  description_chars: 6000         # stored/scored description length

run_budget:
  max_cost_usd: 5.0               # stop launching new agents past this

min_score: 0                      # postings below this final score are not stored

# Role families in priority order; weight multiplies the fit score.
# Tuned to the resume (AI/ML engineer: GenAI, RAG, agents, MLOps; past data scientist/analyst).
# Matching is whole-word / whole-phrase; short tokens (ml, bi, etl, fde, ...) are never
# substring-matched. `generic_titles` (plain "Software Engineer") only qualify if a family
# keyword also appears in the department or the start of the description.
role_families:
  fde:
    weight: 1.00
    keywords: ["forward deployed", "forward-deployed", "fde", "deployment engineer",
               "deployed engineer", "applied ai engineer"]
  ai:
    weight: 0.95
    keywords: ["ai engineer", "ai developer", "ai scientist", "ai researcher", "llm",
               "generative ai", "gen ai", "genai", "applied ai", "artificial intelligence",
               "ai/ml", "ml/ai", "ai agent", "agent engineer", "agentic", "prompt engineer",
               "nlp", "natural language", "conversational ai", "ai software", "ai platform",
               "rag", "responsible ai", "ai evaluation", "evals engineer"]
  ml:
    weight: 0.90
    keywords: ["machine learning", "ml engineer", "ml scientist", "mlops", "ml ops", "ml",
               "deep learning", "research engineer", "applied scientist", "applied research",
               "research scientist", "computer vision", "model engineer", "ml platform",
               "ml infrastructure", "model deployment", "inference engineer", "applied ml"]
  data_engineering:
    weight: 0.85
    keywords: ["data engineer", "analytics engineer", "data platform", "etl", "elt",
               "data pipeline", "data infrastructure", "big data", "data warehouse",
               "data integration", "dataops", "data developer", "data software engineer",
               "streaming engineer", "pipeline engineer"]
  data_analyst:
    weight: 0.80
    keywords: ["data analyst", "business intelligence", "bi analyst", "bi developer",
               "bi engineer", "analytics analyst", "institutional research", "reporting analyst",
               "insights analyst", "product analyst", "decision science", "data visualization",
               "data analytics", "analytics specialist"]
  data_science:
    weight: 0.75
    keywords: ["data scientist", "data science", "research data scientist", "statistician",
               "biostatistician", "applied statistics", "decision scientist",
               "research software engineer"]

# A title containing any of these is never a match, whatever else it says (pre-sales,
# architect, account-facing and support roles don't fit the resume).
title_exclude: ["architect", "sales", "pre-sales", "presales", "account executive",
                "technical account", "customer success", "support engineer", "recruiter",
                "partner manager", "solutions engineer", "solutions consultant"]

generic_titles: ["software engineer", "software developer", "developer", "programmer",
                 "analyst", "engineer", "scientist", "researcher", "specialist", "associate",
                 "research associate", "research specialist", "research programmer"]

scoring:
  keyword_weight: 0.4
  llm_weight: 0.6
  # A JD that names this share of the (weighted) skills list scores 100 on the keyword part.
  keyword_saturation: 0.4
