models:
  agent: claude-sonnet-4-5        # browses careers sites, extracts postings
  scorer: claude-haiku-5-5        # resume-vs-JD fit score
  extractor: claude-haiku-5-5     # reads result lists / posting pages into fields (no navigation)

# USD per million tokens. ASSUMED prices: check the Anthropic pricing page and edit.
# cache_read / cache_write are multipliers on the input price.
pricing:
  claude-sonnet-4-5: { input: 3.0, output: 15.0 }
  claude-haiku-5-5: { input: 1.0, output: 5.0 }
  cache_read: 0.1
  cache_write: 1.25
  web_search_per_1000: 10.0

resumes:
  industry: ~/Documents/Resume/Industry/Avdhut_Zolekar_Resume.pdf
  academic: "~/Documents/Resume/Academic/Avdhut Zolekar.pdf"

database: data/jobs.db
csv_export: data/jobs.csv

verify:
  max_age_days: 30
  http_timeout_s: 10
  concurrency: 10
  title_match_threshold: 85
  closed_markers:
    - "no longer accepting"
    - "position has been filled"
    - "job not found"
    - "this job is no longer available"
  # visa_sponsorship = "no" when the description contains any of these (case-insensitive).
  no_visa_phrases:
    - "will not sponsor"
    - "unable to sponsor"
    - "cannot sponsor"
    - "not able to sponsor"
    - "no visa sponsorship"
    - "without sponsorship"
    - "not eligible for visa sponsorship"
    - "does not provide visa sponsorship"

# Seniority rules (decision 6). Whole-word / whole-phrase, case-insensitive, on the title.
seniority:
  exclude: ["principal", "distinguished", "director", "head of", "vp", "vice president",
            "manager", "intern", "internship", "co-op", "lead", "staff"]
  # Academic searches already sit in the staff section, so bare "staff" is not an exclusion;
  # only these whole phrases are.
  academic_exclude: ["principal", "distinguished", "director", "head of", "vp", "vice president",
                     "manager", "intern", "internship", "co-op", "lead", "senior staff",
                     "staff scientist"]
  # Level numbers at or above this are excluded: "Engineer IV", "Data Scientist 5".
  max_level: 3

locations:
  country_terms: ["united states", "usa", "us", "u.s.", "u.s.a."]
  non_us_terms: ["canada", "uk", "united kingdom", "india", "germany", "ireland", "france",
                 "australia", "japan", "singapore", "brazil", "mexico", "netherlands",
                 "israel", "emea", "apac", "europe"]
  us_states:
    Alabama: AL
    Alaska: AK
    Arizona: AZ
    Arkansas: AR
    California: CA
    Colorado: CO
    Connecticut: CT
    Delaware: DE
    Florida: FL
    Georgia: GA
    Hawaii: HI
    Idaho: ID
    Illinois: IL
    Indiana: IN
    Iowa: IA
    Kansas: KS
    Kentucky: KY
    Louisiana: LA
    Maine: ME
    Maryland: MD
    Massachusetts: MA
    Michigan: MI
    Minnesota: MN
