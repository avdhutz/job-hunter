# Industry orgs. Flow: "<name> careers" -> careers site -> category filter -> postings.
# ats/slug are optional shortcuts: if set (greenhouse|lever|ashby), the JSON API is used instead of the browser.
# `recipe` is filled in automatically after the agent's first successful run.
companies:
  - { name: Anthropic,  ats: greenhouse, slug: anthropic }
  - { name: Palantir,   ats: lever,      slug: palantir }
  - { name: OpenAI,     ats: ashby,      slug: openai }
  - { name: Scale AI,   ats: greenhouse, slug: scaleai }
  - { name: Databricks, ats: greenhouse, slug: databricks }
  - { name: Snowflake }
  - { name: Salesforce }
  - { name: Microsoft }
category_filters: ["Engineering", "Data", "Machine Learning", "AI", "Analytics"]
